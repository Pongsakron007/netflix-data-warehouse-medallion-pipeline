resources:
  jobs:
    pipeline_job:
      name: pipline_${bundle.target}

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: run_Netflix_pipeline # can't have white space
          notebook_task:
            notebook_path: ../run_process_all/run_auto_loader_process.py
          environment_key: default
  
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.package_dependencies}